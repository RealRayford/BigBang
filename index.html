<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<title>Big⭐Bang</title>
<style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 14px;
      font-family: system-ui, Segoe UI, sans-serif;
      background: radial-gradient(circle at top, #1e3a8a, #0f172a 55%);
      color: #f8fafc;
    }
    main { max-width: 1180px; margin: auto; display: grid; gap: 12px; }
    header, .tb, .hx {
      background: #111827d9;
      border: 1px solid #fff2;
      border-radius: 20px;
      box-shadow: 0 20px 70px #0005;
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 14px;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: clamp(1.3rem, 3vw, 2rem); }
    .ru { color: #cbd5e1; font-size: .9rem; }
    .hb, .bt { display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 800;
      background: #38bdf8;
      color: #082f49;
      cursor: pointer;
    }
    button.sc { background: #e2e8f0; color: #111827; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .tb {
      min-height: 500px;
      padding: 14px;
      display: grid;
      grid-template-columns: 210px 1fr 210px;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
    }
    .se {
      background: #1f2937c7;
      border: 1px solid #fff1;
      border-radius: 16px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .se.ac { outline: 3px solid #38bdf8; }
    .se.wi { outline: 3px solid #22c55e; }
    #p0 { grid-column: 1; grid-row: 3; }
    #p1 { grid-column: 1; grid-row: 2; }
    #p2 { grid-column: 2; grid-row: 1; justify-self: center; width: min(420px, 100%); }
    #p3 { grid-column: 3; grid-row: 2; }
    #p4 { grid-column: 3; grid-row: 3; }
    .ce {
      grid-column: 2;
      grid-row: 2;
      background: #02061757;
      border: 1px dashed #fff3;
      border-radius: 22px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }
    .ss { color: #cbd5e1; line-height: 1.45; min-height: 54px; }
    .ss strong { color: white; }
    .pi {
      min-height: 105px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }
    .la { color: #cbd5e1; font-size: .9rem; }
    .hx { padding: 14px; }
    .co { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
    .hd { display: flex; gap: 8px; overflow-x: auto; min-height: 135px; padding: 22px 4px; }
    .wp {
      display: none;
      margin-top: 8px;
      padding: 9px;
      border-radius: 16px;
      background: #02061757;
      border: 1px solid #fff2;
    }
    .wp.on { display: block; }
    .wp-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      color: #cbd5e1;
      font-size: .82rem;
      margin-bottom: 6px;
    }
    .wp-head b { color: #f8fafc; }
    .wp-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 18px 4px 8px;
      min-height: 122px;
      scroll-snap-type: x proximity;
      -webkit-overflow-scrolling: touch;
    }
    .wp-row .cd { scroll-snap-align: start; }
    .cd {
      position: relative;
      flex: 0 0 auto;
      width: 70px;
      height: 102px;
      background: #f8fafc;
      color: #111827;
      border-radius: 12px;
      padding: 9px;
      border: 1px solid #0003;
      box-shadow: 0 10px 22px #0005;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      transition: .12s;
    }
    .cd:hover { transform: translateY(-5px); }
    .cd.sl { transform: translateY(-20px) !important; outline: 3px solid #38bdf8; }
    .cd.sl:after {
      content: '✓';
      position: absolute;
      right: 7px;
      top: 6px;
      width: 21px;
      height: 21px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #38bdf8;
      color: #082f49;
      font-weight: 1000;
    }
    .cd.unpickable {
      cursor: not-allowed;
      opacity: .52;
      filter: grayscale(.55) saturate(.75);
    }
    .cd.unpickable:hover { transform: none; }
    .cd.burned {
      cursor: not-allowed;
      opacity: .68;
      color: #431407;
      background:
        radial-gradient(circle at 50% 84%, rgba(251,146,60,.46), transparent 44%),
        linear-gradient(180deg, #fff7ed, #fed7aa 45%, #7f1d1d 100%);
      border-color: rgba(248,113,113,.65);
      box-shadow: 0 0 18px rgba(249,115,22,.55), 0 10px 22px #0005;
      overflow: hidden;
      filter: saturate(.95) contrast(1.05);
    }
    .cd.burned:hover { transform: none; }
    .cd.burned .rk, .cd.burned .su { text-decoration: line-through; text-decoration-thickness: 2px; }
    .cd.burned:before {
      content: '🔥';
      position: absolute;
      left: 50%;
      bottom: 3px;
      transform: translateX(-50%);
      font-size: 1.25rem;
      z-index: 3;
      filter: drop-shadow(0 0 4px rgba(255,170,0,.8));
      animation: cardFlame .68s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .cd.burned:after {
      content: 'NO';
      position: absolute;
      right: 5px;
      top: 5px;
      min-width: 20px;
      height: 20px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: #7f1d1d;
      color: #fee2e2;
      font-size: .58rem;
      font-weight: 1000;
      z-index: 4;
      pointer-events: none;
    }
    @keyframes cardFlame { from { transform: translateX(-50%) scale(.94) rotate(-3deg); } to { transform: translateX(-50%) scale(1.08) rotate(4deg); } }
    .rd { color: #b91c1c; }
    .sr { color: #92400e; }
    .suit-club { color: #166534; }
    .suit-diamond { color: #2563eb; }
    .suit-heart { color: #b91c1c; }
    .suit-spade { color: #4338ca; }
    .suit-star { color: #ca8a04; text-shadow: 0 0 8px rgba(202,138,4,.22); }
    .rk { font-size: 1.35rem; font-weight: 900; }
    .su { font-size: 1.6rem; align-self: flex-end; }
    .sm { width: 40px; height: 58px; padding: 5px; border-radius: 8px; cursor: default; }
    .sm .rk { font-size: .85rem; }
    .sm .su { font-size: 1rem; }
    .tg {
      display: inline-flex;
      width: max-content;
      border-radius: 999px;
      padding: 5px 9px;
      background: #94a3b826;
      color: #cbd5e1;
      font-size: .82rem;
    }
    .gd, .good { background: #22c55e29; color: #bbf7d0; }
    .bd, .bad { background: #ef444429; color: #fecaca; }
    .wn, .warn { background: #f59e0b29; color: #fde68a; }
    .bks, .pl { display: flex; gap: 4px; flex-wrap: wrap; }
    .ba { width: 19px; height: 27px; border-radius: 5px; background: linear-gradient(135deg, #e0f2fe, #bae6fd); border: 1px solid #0004; }
    .pl { min-height: 58px; border-top: 1px solid #fff2; padding-top: 8px; }
    .selinfo { font-size: .84rem; color: #cbd5e1; margin-top: 6px; min-height: 22px; color: #cbd5e1; }
    .selinfo.bad { color: #fecaca; }
    .txp {
      display: none;
      margin: 9px 0 10px;
      padding: 10px;
      border-radius: 14px;
      border: 1px solid #38bdf84d;
      background: #0369a129;
      color: #e0f2fe;
      font-size: .84rem;
      line-height: 1.35;
    }
    .txp.on { display: block; }
    .txp-title { font-weight: 1000; color: #f8fafc; margin-bottom: 5px; }
    .txp-row { margin-top: 3px; }
    .txp-row.now { color: #bbf7d0; font-weight: 800; }
    .txp-note { margin-top: 6px; color: #cbd5e1; font-size: .78rem; }
    @keyframes shake { 20%,80% { transform: translateX(5px); } 40%,60% { transform: translateX(-7px); } }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 #38bdf877; } 100% { box-shadow: 0 0 0 26px #38bdf800; } }
    body.fx-bomb main { animation: shake .42s both; }
    .fx-clear .ce, .fx-special .ce, .fx-penalty .tb { animation: pulse .65s ease-out; }
    @media (max-width: 430px) and (orientation: portrait) {
      html { min-height: 100%; -webkit-text-size-adjust: 100%; }
      body { min-height: 100svh; padding: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom)); overflow-x: hidden; }
      main { gap: 7px; max-width: 100%; }
      header { padding: 8px; gap: 7px; border-radius: 14px; }
      h1 { font-size: 1.18rem; line-height: 1.1; }
      .ru { font-size: .72rem; line-height: 1.25; max-height: 2.6em; overflow: hidden; }
      .hb { width: 100%; gap: 6px; }
      .hb button { flex: 1 1 0; padding: 8px 9px; font-size: .78rem; }
      .tb { min-height: 0; padding: 7px; gap: 7px; border-radius: 14px; }
      .se { padding: 7px; gap: 4px; border-radius: 12px; }
      .se b { font-size: .82rem; }
      .tg { font-size: .7rem; padding: 4px 7px; }
      .bks { gap: 3px; }
      .ba { width: 13px; height: 19px; border-radius: 4px; }
      .pl { min-height: 38px; padding-top: 5px; }
      .ce { padding: 8px; gap: 7px; border-radius: 15px; }
      .ss { min-height: 0; font-size: .82rem; line-height: 1.3; }
      .pi { min-height: 58px; gap: 4px; }
      .la { font-size: .75rem; }
      .hx { position: sticky; bottom: 0; z-index: 20; padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); border-radius: 14px 14px 0 0; }
      .co { gap: 6px; }
      .co > div:first-child { width: 100%; }
      .selinfo { min-height: 18px; font-size: .72rem; margin-top: 3px; }
      .txp { margin: 6px 0 7px; padding: 7px; font-size: .72rem; border-radius: 10px; }
      .txp-note { font-size: .68rem; }
      .bt { width: 100%; gap: 5px; }
      .bt button { flex: 1 1 30%; padding: 8px 6px; font-size: .75rem; min-width: 0; }
      #play, #pass { flex-basis: 31%; }
      #suggest, #clear, #sort { flex-basis: 29%; }
      .hd { min-height: 98px; gap: 6px; padding: 16px 3px 6px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
      .wp { margin-top: 6px; padding: 7px; border-radius: 12px; }
      .wp-head { font-size: .7rem; margin-bottom: 4px; }
      .wp-row { min-height: 94px; gap: 6px; padding: 14px 3px 6px; }
      .cd { width: 48px; height: 72px; padding: 7px; border-radius: 10px; scroll-snap-align: start; }
      .cd:hover { transform: none; }
      .cd.sl { transform: translateY(-14px) !important; }
      .cd.sl:after { width: 18px; height: 18px; right: 5px; top: 5px; font-size: .75rem; }
      .cd.burned:before { font-size: 1rem; bottom: 2px; }
      .cd.burned:after { width: 17px; height: 17px; right: 4px; top: 4px; font-size: .5rem; }
      .rk { font-size: .96rem; }
      .su { font-size: 1.15rem; }
      .sm { width: 30px; height: 44px; padding: 4px; border-radius: 7px; }
      .sm .rk { font-size: .68rem; }
      .sm .su { font-size: .82rem; }
    }
    .mgfx, .dhfx, .drfx, .bkfx {
      position: fixed;
      inset: 0;
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      overflow: hidden;
    }
    .mgfx.on, .dhfx.on, .drfx.on, .bkfx.on { opacity: 1; visibility: visible; }
    .mgfx-backdrop { background: radial-gradient(circle at center, rgba(255,90,0,.18), rgba(0,0,0,.82) 60%), rgba(5,8,18,.70); backdrop-filter: blur(3px); }
    .mgfx-stage, .dhfx-stage, .drfx-stage, .bkfx-stage { position:absolute; inset:0; }
    .mgfx-girl { position:absolute; left:50%; bottom:-5%; width:min(72vw,430px); transform:translateX(-50%) translateY(50px) scale(.78); transform-origin:50% 100%; opacity:0; filter:drop-shadow(0 18px 55px rgba(0,0,0,.55)); }
    .mgfx.on .mgfx-girl { animation: mgGirlIn .42s cubic-bezier(.2,.8,.2,1) forwards; }
    .mgfx.raise .mgfx-girl { animation: mgGirlIn .42s cubic-bezier(.2,.8,.2,1) forwards, mgRaise .42s ease-out .42s forwards; }
    .mgfx-text { position:absolute; left:50%; top:12%; transform:translateX(-50%) scale(.8); padding:12px 18px; border-radius:999px; background:rgba(25,10,10,.84); border:2px solid rgba(255,255,255,.22); color:#fff3d6; font-weight:1000; letter-spacing:.04em; font-size:clamp(1.2rem,4vw,2.5rem); text-shadow:0 0 8px rgba(255,120,0,.5),0 0 18px rgba(255,80,0,.32); opacity:0; }
    .mgfx.talk .mgfx-text { animation: mgTextPop .38s ease-out forwards; }
    .mgfx-staffCharge { position:absolute; right:23%; bottom:35%; width:110px; height:110px; border-radius:50%; opacity:0; background:radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(120,200,255,.95) 18%, rgba(70,140,255,.85) 36%, rgba(255,120,20,.78) 58%, rgba(255,80,0,0) 74%); filter:blur(2px); }
    .mgfx.charge .mgfx-staffCharge { animation: mgCharge .58s ease-out forwards; }
    .mgfx-ring { position:absolute; right:23%; bottom:35%; width:30px; height:30px; border:3px solid rgba(255,200,100,.95); border-radius:50%; opacity:0; transform:translate(50%,50%) scale(.2); box-shadow:0 0 25px rgba(255,120,0,.8); }
    .mgfx.charge .mgfx-ring { animation: mgRing .68s ease-out forwards; }
    .mgfx-flash { background:radial-gradient(circle at center, rgba(255,255,255,.98), rgba(255,220,120,.72) 28%, rgba(255,110,0,.24) 54%, rgba(255,110,0,0) 70%); }
    .mgfx.boom .mgfx-flash { animation: mgFlash .45s ease-out forwards; }
    .mgfx-blast { position:absolute; left:50%; top:50%; width:18vmax; height:18vmax; border-radius:50%; transform:translate(-50%,-50%) scale(.1); opacity:0; background:radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,235,170,.95) 10%, rgba(255,170,50,.84) 26%, rgba(255,90,0,.66) 44%, rgba(255,60,0,.14) 63%, rgba(255,60,0,0) 74%); box-shadow:0 0 50px rgba(255,120,0,.95),0 0 110px rgba(255,70,0,.75),0 0 180px rgba(255,180,80,.48); }
    .mgfx.boom .mgfx-blast { animation: mgBlast .62s cubic-bezier(.12,.84,.18,1) forwards; }
    body.mgfx-shake main { animation: mgShake .58s cubic-bezier(.25,.1,.25,1); }
    @keyframes mgGirlIn { 0%{opacity:0;transform:translateX(-50%) translateY(50px) scale(.78) rotate(-6deg);} 100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1) rotate(0deg);} }
    @keyframes mgRaise { 0%{transform:translateX(-50%) translateY(0) scale(1) rotate(0deg);} 100%{transform:translateX(-50%) translateY(-6px) scale(1.02) rotate(-2deg);} }
    @keyframes mgTextPop { 0%{opacity:0;transform:translateX(-50%) scale(.55) translateY(-12px);} 60%{opacity:1;transform:translateX(-50%) scale(1.08) translateY(0);} 100%{opacity:1;transform:translateX(-50%) scale(1);} }
    @keyframes mgCharge { 0%{opacity:0;transform:scale(.2);} 25%{opacity:.95;} 100%{opacity:1;transform:scale(2.45);} }
    @keyframes mgRing { 0%{opacity:0;transform:translate(50%,50%) scale(.2);} 20%{opacity:1;} 100%{opacity:0;transform:translate(50%,50%) scale(9);} }
    @keyframes mgFlash { 0%{opacity:0;} 25%{opacity:1;} 100%{opacity:0;} }
    @keyframes mgBlast { 0%{opacity:0;transform:translate(-50%,-50%) scale(.1);} 15%{opacity:1;} 100%{opacity:1;transform:translate(-50%,-50%) scale(10);} }
    @keyframes mgShake { 0%,100%{transform:translate(0,0) rotate(0);} 10%{transform:translate(-8px,4px) rotate(-1deg);} 20%{transform:translate(12px,-5px) rotate(1deg);} 30%{transform:translate(-10px,7px) rotate(-1deg);} 40%{transform:translate(14px,-8px) rotate(1deg);} 50%{transform:translate(-10px,6px) rotate(0);} 60%{transform:translate(8px,-4px) rotate(1deg);} 70%{transform:translate(-6px,3px) rotate(0);} 80%{transform:translate(5px,-2px) rotate(0);} }
    .dhfx-backdrop { background:radial-gradient(circle at center, rgba(10,15,25,.08), rgba(0,0,0,.64) 66%); backdrop-filter:blur(1px); opacity:.35; }
    .dhfx.on .dhfx-backdrop { animation: dhBackdrop 1.65s ease-in-out forwards; }
    .dhfx-vortex { position:absolute; left:50%; top:50%; width:22vmin; height:22vmin; border-radius:50%; opacity:0; transform:translate(-50%,-50%) scale(.12) rotate(0deg); background: conic-gradient(from 0deg, #020617, #111827, #0ea5e9, #312e81, #000, #38bdf8, #020617); box-shadow:0 0 28px rgba(56,189,248,.45), inset 0 0 40px #000; filter:saturate(1.25) contrast(1.2); }
    .dhfx-vortex:before { content:''; position:absolute; inset:10%; border-radius:50%; background:radial-gradient(circle, #000 0%, #020617 30%, transparent 65%); box-shadow:inset 0 0 45px #000,0 0 30px rgba(0,0,0,.9); }
    .dhfx-vortex:after { content:''; position:absolute; inset:-18%; border-radius:50%; border:2px solid rgba(125,211,252,.32); box-shadow:0 0 24px rgba(56,189,248,.38); }
    .dhfx.grow .dhfx-vortex { animation: dhGrow 1.22s cubic-bezier(.15,.74,.18,1) forwards, dhSpin .48s linear infinite; }
    .dhfx.implode .dhfx-vortex { animation: dhImplode .36s cubic-bezier(.6,-.2,.88,.2) forwards; }
    .dhfx-core { position:absolute; left:50%; top:50%; width:12vmin; height:12vmin; border-radius:50%; transform:translate(-50%,-50%) scale(.1); opacity:0; background:#000; box-shadow:0 0 55px #000,0 0 90px rgba(14,165,233,.75); }
    .dhfx.grow .dhfx-core { animation: dhCore 1.22s ease-out forwards; }
    .dhfx.implode .dhfx-core { animation: dhCoreImplode .34s ease-in forwards; }
    .dhfx-ring { position:absolute; left:50%; top:50%; width:18vmin; height:18vmin; border-radius:50%; transform:translate(-50%,-50%) scale(.2); opacity:0; border:2px solid rgba(147,197,253,.35); box-shadow:0 0 24px rgba(14,165,233,.45); }
    .dhfx.grow .dhfx-ring1 { animation: dhRing 1.1s ease-out forwards; }
    .dhfx.grow .dhfx-ring2 { animation: dhRing 1.2s ease-out .15s forwards; }
    .dhfx-flash { background:radial-gradient(circle, rgba(255,255,255,.75), rgba(14,165,233,.18) 24%, rgba(0,0,0,.92) 52%, #000 100%); }
    .dhfx.implode .dhfx-flash { animation: dhPop .36s ease-out forwards; }
    body.dhfx-warp main { animation: dhWarp 1.45s ease-in-out; }
    @keyframes dhBackdrop { 0%{opacity:.15;} 55%{opacity:.82;} 74%{opacity:1;} 100%{opacity:0;} }
    @keyframes dhGrow { 0%{opacity:0;transform:translate(-50%,-50%) scale(.12) rotate(0deg);} 10%{opacity:1;} 72%{opacity:1;transform:translate(-50%,-50%) scale(4.2) rotate(620deg);} 100%{opacity:1;transform:translate(-50%,-50%) scale(8.4) rotate(920deg);} }
    @keyframes dhImplode { 0%{opacity:1;transform:translate(-50%,-50%) scale(8.4) rotate(920deg);} 82%{opacity:1;transform:translate(-50%,-50%) scale(.03) rotate(1100deg);} 100%{opacity:0;transform:translate(-50%,-50%) scale(0) rotate(1120deg);} }
    @keyframes dhSpin { to{rotate:360deg;} }
    @keyframes dhCore { 0%{opacity:0;transform:translate(-50%,-50%) scale(.1);} 18%{opacity:1;} 100%{opacity:1;transform:translate(-50%,-50%) scale(7.5);} }
    @keyframes dhCoreImplode { 0%{opacity:1;transform:translate(-50%,-50%) scale(7.5);} 100%{opacity:0;transform:translate(-50%,-50%) scale(0);} }
    @keyframes dhRing { 0%{opacity:0;transform:translate(-50%,-50%) scale(.2);} 16%{opacity:.9;} 100%{opacity:0;transform:translate(-50%,-50%) scale(7.8);} }
    @keyframes dhPop { 0%{opacity:0;} 32%{opacity:1;} 100%{opacity:0;} }
    @keyframes dhWarp { 0%,100%{transform:scale(1);} 45%{transform:scale(.985) rotate(.4deg);} 68%{transform:scale(.94) rotate(-.6deg);} 82%{transform:scale(1.015) rotate(.2deg);} }
    .drfx-backdrop { background:linear-gradient(180deg, rgba(3,7,18,.58), rgba(15,23,42,.25), rgba(127,29,29,.28)); backdrop-filter:blur(1px); }
    .drfx-dragon { position:absolute; left:-56vw; top:16%; width:min(72vw,680px); height:auto; filter:drop-shadow(0 20px 45px rgba(0,0,0,.58)) drop-shadow(0 0 26px rgba(34,211,238,.55)); transform:rotate(-8deg) scale(.92); opacity:0; }
    .drfx.fly .drfx-dragon { animation: drFly 1.55s cubic-bezier(.14,.68,.22,1) forwards; }
    .drfx-fire { position:absolute; left:29%; top:43%; width:0; height:18vmin; transform:skewX(-18deg) rotate(-7deg); transform-origin:left center; opacity:0; border-radius:0 999px 999px 0; background:linear-gradient(90deg, rgba(255,255,255,.95), rgba(251,191,36,.96) 18%, rgba(249,115,22,.9) 42%, rgba(59,130,246,.55) 70%, rgba(14,165,233,0)); filter:blur(1px); box-shadow:0 0 30px rgba(251,146,60,.85),0 0 80px rgba(14,165,233,.55); }
    .drfx.breath .drfx-fire { animation: drFire .72s ease-out forwards; }
